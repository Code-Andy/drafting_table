name: iPad unsigned IPA

on:
  push:
    branches: ["**"]
    # Version tags use the conventional v1.2.3 form.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Release tag (e.g. v0.9.7; blank will extract from project.yml)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release title (optional)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ipad-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS device IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK $sdk_version"
          [[ "${sdk_version%%.*}" -ge 18 ]]

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen version

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f project.yml ]]; then
            echo "error: project.yml is required for the iPad target" >&2
            exit 1
          fi
          xcodegen generate --spec project.yml
          test -d DraftingTable.xcodeproj

      - name: Build and package unsigned IPA
        shell: bash
        env:
          # These are repeated here as an audit-friendly guard in addition to
          # the settings passed by build_ipa.sh.
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
        run: |
          set -euo pipefail
          bash scripts/ios/build_ipa.sh 2>&1 | tee /tmp/xcodebuild.log

      - name: Report build error on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f /tmp/xcodebuild.log ]]; then
            echo "::error::--- XCODEBUILD ERRORS ---"
            grep -E 'error:|fatal error:' /tmp/xcodebuild.log | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 60 /tmp/xcodebuild.log
          fi

      - name: Launch smoke test in iPad Simulator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ios/smoke_simulator.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: DraftingTable-ipa-${{ github.sha }}
          path: dist/ios/DraftingTable.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged IPA
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: DraftingTable-ipa-${{ github.sha }}
          path: dist/ios

      - name: Publish version tag release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          INPUT_TITLE: ${{ github.event.inputs.release_title }}
          IS_PRERELEASE: ${{ github.event.inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          tag=""
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(grep 'MARKETING_VERSION:' project.yml | head -n1 | awk '{print $2}' | tr -d '"')
            tag="v${version}"
          fi

          title="${INPUT_TITLE:-Drafting Table $tag}"
          prerelease_flag=""
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists, uploading asset..."
            gh release upload "$tag" dist/ios/DraftingTable.ipa --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating release $tag..."
            gh release create "$tag" dist/ios/DraftingTable.ipa --generate-notes \
              --title "$title" $prerelease_flag --repo "$GITHUB_REPOSITORY"
          fi
