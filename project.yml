name: DraftingTable

options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CLANG_CXX_LIBRARY: libc++
    ENABLE_BITCODE: NO

targets:
  DraftingTable:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: platforms/ipad
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bgkatz.draftingtable.ipad
        PRODUCT_NAME: DraftingTable
        INFOPLIST_FILE: platforms/ipad/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: platforms/ipad/DraftingTable-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        OTHER_CPLUSPLUSFLAGS:
          - -std=c++17
          - -fobjc-arc
    info:
      path: platforms/ipad/Info.plist
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: PencilKit.framework
      - sdk: CoreGraphics.framework
