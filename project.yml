name: DraftingTable

options:
  deploymentTarget:
    iOS: "17.5"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    ENABLE_BITCODE: NO

targets:
  DraftingTable:
    type: application
    platform: iOS
    deploymentTarget: "17.5"
    sources:
      - path: platforms/ipad
        excludes:
          - Info.plist
      - path: core/include
        buildPhase: none
      - path: core/src
      - path: renderer/common
      - path: renderer/metal
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.draftingtable.ipad
        PRODUCT_NAME: DraftingTable
        MARKETING_VERSION: 0.8.0
        CURRENT_PROJECT_VERSION: 11
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: platforms/ipad/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: platforms/ipad/DraftingTable-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        CLANG_ENABLE_OBJC_ARC: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/core/include"
          - "$(SRCROOT)/renderer/common"
          - "$(SRCROOT)/renderer/metal"
        OTHER_CPLUSPLUSFLAGS:
          - -std=c++20
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: PencilKit.framework
      - sdk: CoreGraphics.framework
