<script>
(()=>{
const root=document.getElementById('dt-workspace-study');
const q=s=>root.querySelector(s), qa=s=>Array.from(root.querySelectorAll(s));
const state={tool:'Brush',tab:'layers',collapsed:false,color:'#2a2823',previous:'#ab462f',size:8,opacity:100,hardness:85,pressure:75,uniform:true,gap:4,bleed:2,tolerance:16,fillSource:'Active layer',shadeClose:'Straight chord',width:2,shapeFill:'None',feather:0,selectionMode:'Replace',grid:true,snap:true,pixel:false,angle:true,angleStep:'15°',gridStep:10,rotation:0,zoom:100,hover:true,predict:true,pencilOnly:true,haptics:true,doubleTap:'Brush / eraser',squeeze:'Quick palette',barrel:'Shade orientation',activation:3,stabilize:15,hand:'right',appearance:'light',textSize:12,iconSize:17,panelWidth:244,comfort:false,docName:'Desk lamp · studies',preset:'A4',orientation:'Portrait',dpi:300,page:1,layer:2,settingTab:'Workspace',exportFormat:'PNG',exportScope:'Current page',background:true,exportScale:'1×',copySelection:false,selected:false,layerCounter:4,pages:[{id:1,name:'Form studies'},{id:2,name:'Joint detail'},{id:3,name:'Color variations'}],layers:[{id:1,name:'Construction',type:'V',visible:true,locked:false,opacity:35},{id:2,name:'Ink',type:'R',visible:true,locked:false,opacity:100},{id:3,name:'Shading',type:'R',visible:true,locked:false,opacity:80}],history:[],redo:[],docs:['Desk lamp · studies','Workshop details','Perspective warmups'],errorMode:'Saved'};
const tools=[['Brush','pen-tool','B'],['Eraser','eraser','E'],['Bucket','paint-bucket','F'],['Shade','blend','H'],['Line','slash','L'],['Rectangle','square','R'],['Circle','circle','C'],['Ellipse','circle-ellipsis','O'],['Select','scan','V'],['Lasso','lasso','Q'],['Eyedropper','pipette','I']];
const palette=['#000000','#6E2218','#8A3F0F','#886C18','#3D5E26','#195049','#1A3D60','#4A2A65','#1A1A1A','#B5482E','#C77A1F','#C8A030','#5A8C3A','#2F7E78','#2A5D8F','#6B3A8A','#6E6457','#C07A60','#D0A270','#CAB870','#95B070','#6FA59E','#6F95C0','#A088B5','#FFFFFF','#7A7368','#A89E8A','#D9CFB8','#F2D89A','#F2A48F','#9DB8D8','#C7D2A8'];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const btn=(a,label,icon='',cl='',disabled=false)=>`<button data-action="${a}" class="${cl}" ${disabled?'disabled':''}>${icon?ico(icon):''}${label}</button>`;
const ibtn=(a,label,icon,disabled=false)=>`<button class="dt-icon" data-action="${a}" aria-label="${escape(label)}" ${disabled?'disabled':''}>${ico(icon)}</button>`;
const check=(key,label)=>`<label class="dt-check"><span>${label}</span><input type="checkbox" data-key="${key}" ${state[key]?'checked':''}></label>`;
const range=(key,label,min,max,unit='',step=1)=>`<label class="dt-range"><span>${label}</span><output data-value="${key}">${state[key]}${unit}</output><input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${state[key]}" data-unit="${unit}" aria-label="${label}"></label>`;
const select=(key,label,options)=>`<label class="dt-field"><span>${label}</span><select data-key="${key}" aria-label="${label}">${options.map(v=>`<option ${String(state[key])===String(v)?'selected':''}>${escape(v)}</option>`).join('')}</select></label>`;
const input=(key,label,type='text')=>`<label class="dt-field"><span>${label}</span><input data-key="${key}" aria-label="${label}" type="${type}" value="${escape(state[key])}"></label>`;
const section=(title,html)=>`<section class="dt-section"><h3 class="dt-section-title">${title}</h3>${html}</section>`;
const currentLayer=()=>state.layers.find(l=>l.id===state.layer)||state.layers[0];
const icons=()=>{if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}})};
let toastTimer,returnFocus;
function toast(text){q('.dt-toast').textContent=text;q('.dt-toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>q('.dt-toast').hidden=true,3500)}
function history(){state.history.push(JSON.stringify({layers:state.layers,pages:state.pages,layer:state.layer,page:state.page}));state.redo=[]}
function applyDesign(){root.dataset.hand=state.hand;root.dataset.appearance=state.appearance;root.style.setProperty('--dt-font',state.textSize+'px');root.style.setProperty('--dt-icon',state.iconSize+'px');root.style.setProperty('--dt-panel',state.panelWidth+'px');root.style.setProperty('--dt-hit',state.comfort?'48px':'44px')}
function sync(){
 applyDesign();q('.dt-app').dataset.collapsed=String(state.collapsed);q('[data-action="inspector"]').setAttribute('aria-pressed',String(!state.collapsed));q('[data-document-title]').textContent=state.docName;q('[data-foot-tool]').textContent=state.tool+' · '+currentLayer().name;q('[data-foot-page]').textContent=state.preset+' · '+state.dpi+' dpi';q('[data-foot-grid]').textContent=(state.grid?'Grid '+state.gridStep+' mm':'Grid off')+' · Snap '+(state.snap?'on':'off');q('[data-zoom]').textContent=state.zoom+'%';q('.dt-canvas-meta').textContent=String(state.page).padStart(2,'0')+' / '+(state.pages.find(p=>p.id===state.page)?.name||'Untitled');q('.dt-paper').classList.toggle('dt-grid',state.grid);q('.dt-paper').style.setProperty('--dt-rotation',state.rotation+'deg');q('.dt-paper').style.scale=state.zoom/100;q('.dt-selection').classList.toggle('on',state.selected);q('[data-action="undo"]').disabled=!state.history.length;q('[data-action="redo"]').disabled=!state.redo.length;
 q('.dt-paper').style.backgroundSize=(state.gridStep*2)+'px '+(state.gridStep*2)+'px';
 qa('[data-art-layer]').forEach(el=>{const l=state.layers.find(l=>(l.artName||l.name)===el.dataset.artLayer);el.style.opacity=l&&l.visible?l.opacity/100:0});
 qa('[data-tool]').forEach(b=>b.setAttribute('aria-pressed',String(state.tool===b.dataset.tool)));qa('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(state.tab===b.dataset.tab)));q('#dt-panel-content').setAttribute('aria-labelledby','dt-tab-'+state.tab);
 qa('.dt-tool-corner').forEach(b=>b.setAttribute('aria-expanded',String(state.toolWindow&&b.dataset.action==='toolOptions:'+state.tool)));q('.dt-wheel-center')?.style.setProperty('--chosen',state.color);
}
function quickRange(key,label,max,unit){return `<label class="dt-quick"><span>${label}</span><input type="range" data-key="${key}" min="${key==='size'?1:0}" max="${max}" value="${state[key]}" data-unit="${unit}" aria-label="${label}"><output data-value="${key}">${state[key]}${unit}</output></label>`}
function context(){
 const el=q('.dt-context');el.hidden=!state.toolWindow;
 if(!state.toolWindow)return;
 const t=state.tool;
 let body;
 if(['Brush','Eraser','Shade'].includes(t)){
 body=range('size','Size',1,80,' px')+range('opacity','Opacity',0,100,'%')+range('hardness','Hardness',0,100,'%')+range('pressure','Pressure',0,100,'%')+check('uniform','Uniform opacity');
 if(t==='Shade')body+=select('shadeClose','Closure',['Straight chord','Close to start']);
 body+='<details class="dt-options-advanced"><summary>Stroke feel</summary>'+range('stabilize','Stabilization',0,100,'%')+check('predict','Motion prediction')+'</details>';
 }else body=renderTool();
 el.innerHTML='<div class="dt-window-head"><strong>'+t+'</strong><button class="dt-icon" data-action="pinTool" aria-label="Pin tool window" aria-pressed="'+state.toolPinned+'">'+ico('pin')+'</button>'+ibtn('closeTool','Close tool options','x')+'</div><div class="dt-window-body">'+body+'</div>';
 positionTool();icons();
}
function positionTool(){
 const el=q('.dt-context'),slot=q('[data-tool="'+state.tool+'"]')?.closest('.dt-tool-slot');
 if(!slot||el.hidden)return;
 const area=q('.dt-workarea');
 const top=slot.offsetTop;
 el.style.top=Math.max(6,Math.min(top,area.clientHeight-el.offsetHeight-8))+'px';
}
function renderTool(){
 const t=state.tool;let body='';
 if(['Brush','Eraser','Shade'].includes(t)){body+=section(t+' settings',range('size','Size',1,80,' px')+range('opacity','Opacity',0,100,'%')+range('hardness','Hardness',0,100,'%')+range('pressure','Pressure response',0,100,'%')+check('uniform','Uniform opacity'));if(t==='Shade')body+=select('shadeClose','Open-path closure',['Straight chord','Close to start'])+`<div class="dt-subtle">The enclosed area fills when you lift the Pencil.</div>`;body+=section('Stroke feel',range('stabilize','Stabilization',0,100,'%')+check('predict','Motion prediction'))}

function moveLayer(delta){const i=state.layers.findIndex(x=>x.id===state.layer),j=i+delta;if(j<0||j>=state.layers.length)return;history();[state.layers[i],state.layers[j]]=[state.layers[j],state.layers[i]];layerMenu(state.layer)}
function chooseTool(t){if(t===state.tool){state.toolWindow=!state.toolWindow}else{if(t==='Eyedropper')state.previousTool=state.tool;state.tool=t;if(!state.toolPinned)state.toolWindow=false}state.selected=['Select','Lasso'].includes(t);q('.dt-color-window').hidden=true;context();sync();icons()}
function action(a){
 if(a.startsWith('toolOptions:')){const t=a.slice(12);if(t===state.tool)state.toolWindow=!state.toolWindow;else{state.tool=t;state.toolWindow=true}q('.dt-color-window').hidden=true;if(q('.dt-workarea').clientWidth<820)state.collapsed=true;context();sync();return}

 if(a==='colorClose'){q('.dt-color-window').hidden=true;return}
 if(a.startsWith('wheelMode:')){state.wheelMode=a.slice(10);if(state.wheelMode!=='Custom')state.lastBaseMode=state.wheelMode;renderWheel();showColorEditor();return}
 if(a.startsWith('customSlot:')){state.customSlot=+a.slice(11);state.color=state.customPalette[state.customSlot];showColorEditor();renderWheel();return}
 if(a==='replaceCustom'){state.customPalette[state.customSlot]=state.color;renderWheel();showColorEditor();toast('Custom wheel updated · slot '+(state.customSlot+1));return}
 if(a==='addCustom'){if(state.customPalette.length<12){state.customPalette.push(state.color);state.customSlot=state.customPalette.length-1}renderWheel();showColorEditor();return}
 if(a==='undo'||a==='redo'){const source=a==='undo'?state.history:state.redo,target=a==='undo'?state.redo:state.history;if(source.length){target.push(JSON.stringify({layers:state.layers,pages:state.pages,layer:state.layer,page:state.page}));Object.assign(state,JSON.parse(source.pop()));render()}return}
 if(a.startsWith('quick:')){close();chooseTool(a.slice(6));return}
 if(a.startsWith('visible:')){history();const l=state.layers.find(x=>x.id===+a.split(':')[1]);l.visible=!l.visible;panel();return}
 if(a.startsWith('layer:')){state.layer=+a.split(':')[1];panel();return}
 if(a.startsWith('layerMenu:')){state.layerName=null;layerMenu(+a.split(':')[1]);return}

 if(a.startsWith('pageMenu:')){state.page=+a.split(':')[1];const p=state.pages.find(p=>p.id===state.page);state.pageName=p.name;dialog('Page · '+escape(p.name),input('pageName','Name')+`<div class="dt-two">${btn('pageDuplicate','Duplicate','copy')}${btn('pageDelete','Delete','trash-2','dt-danger',state.pages.length===1)}${btn('pageUp','Move earlier','arrow-up','',state.pages[0].id===p.id)}${btn('pageDown','Move later','arrow-down','',state.pages.at(-1).id===p.id)}</div>`,btn('pageRename','Done','','dt-primary'));return}
 if(['pageDuplicate','pageDelete','pageUp','pageDown','pageRename','doPageDelete'].includes(a)){const i=state.pages.findIndex(p=>p.id===state.page);if(a==='pageDelete'){confirm('Delete page?','Delete this page and all its layers? This can be undone.','doPageDelete');return}history();if(a==='pageDuplicate'){const p={...state.pages[i],id:Math.max(...state.pages.map(x=>x.id))+1,name:state.pages[i].name+' copy'};state.pages.splice(i+1,0,p);state.page=p.id}if(a==='doPageDelete'&&state.pages.length>1){state.pages.splice(i,1);state.page=state.pages[Math.min(i,state.pages.length-1)].id}if(a==='pageRename')state.pages[i].name=state.pageName.trim()||state.pages[i].name;if(a==='pageUp'||a==='pageDown'){const j=i+(a==='pageUp'?-1:1);if(j>=0&&j<state.pages.length)[state.pages[i],state.pages[j]]=[state.pages[j],state.pages[i]]}close();panel();return}
 if(a.startsWith('settingTab:')){state.settingTab=a.split(':')[1];settings();return}

 if(a.startsWith('docDelete:')){state.docIndex=+a.split(':')[1];confirm('Delete document?','Delete “'+escape(state.docs[state.docIndex])+'”? The native app should move it to Recently Deleted.','deleteDoc');return}

 if(actions[a])actions[a]();
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled||wheelSuppress)return;if(b.dataset.wheelColor){pickWheelColor(b.dataset.wheelColor,+b.dataset.slot);return;}if(b.dataset.tool){chooseTool(b.dataset.tool);return}if(b.dataset.tab){openPanel(b.dataset.tab);return}if(b.dataset.color){state.previous=state.color;state.color=b.dataset.color.toLowerCase();render();return}if(b.dataset.action)action(b.dataset.action)});
root.addEventListener('input',e=>{const el=e.target,key=el.dataset.key;if(!key)return;if(key==='layerOpacity'){currentLayer().opacity=+el.value}else if(key==='hex'){if(/^#[0-9a-f]{6}$/i.test(el.value))state.color=el.value.toLowerCase();else return}else if(key==='rgb'){const c=el.value.split(',').map(x=>Number(x.trim()));if(c.length!==3||c.some(x=>!Number.isInteger(x)||x<0||x>255))return;state.color='#'+c.map(x=>x.toString(16).padStart(2,'0')).join('')}else state[key]=el.type==='checkbox'?el.checked:['range','number'].includes(el.type)?+el.value:el.value;qa(`[data-value="${key}"]`).forEach(o=>o.textContent=(key==='layerOpacity'?currentLayer().opacity:state[key])+(el.dataset.unit||''));qa(`[data-key="${key}"]`).forEach(other=>{if(other!==el){if(el.type==='checkbox')other.checked=el.checked;else other.value=el.value}});if(['hue','saturation','value'].includes(key)){state.color=hsvColor(state.hue,state.saturation,state.value);syncColorEditor()}sync()});
root.addEventListener('change',e=>{const key=e.target.dataset.key;if(['color','hex','rgb'].includes(key)){hsvFromColor();syncColorEditor();renderWheel()}if(['hue','saturation','value'].includes(key))renderWheel();if(key==='preset')pageSetup(q('#dt-dialog-title')?.textContent==='New document');if(state.keepAspect&&['transformW','transformH'].includes(key)){const other=key==='transformW'?'transformH':'transformW';state[other]=Math.round(state[key]*(key==='transformW'?185/257:257/185));q(`[data-key="${other}"]`).value=state[other]}});
root.addEventListener('pointerdown',e=>{if(e.target.dataset.key==='layerOpacity')history()});
q('.dt-overlay').addEventListener('click',e=>{if(e.target===q('.dt-overlay'))close()});
root.addEventListener('keydown',e=>{if(!q('.dt-overlay').hidden&&e.key==='Tab'){const focusables=Array.from(q('.dt-dialog').querySelectorAll('button:not(:disabled),input,select'));const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}if(e.key==='Escape'){if(!q('.dt-overlay').hidden)close();else if(!q('.dt-color-window').hidden){q('.dt-color-window').hidden=true}else if(state.toolWindow){state.toolWindow=false;context()}else{state.collapsed=true;sync()}return}if(e.target.dataset.tab&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const tabs=qa('[data-tab]'),i=tabs.indexOf(e.target),next=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];openPanel(next.dataset.tab);next.focus();return}if(e.target.matches('input,select,textarea')||!q('.dt-overlay').hidden)return;if(e.code==='Backslash'){e.preventDefault();actions.focus();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();action(e.shiftKey?'redo':'undo');return}const t=tools.find(t=>t[2].toLowerCase()===e.key.toLowerCase());if(t&&!e.metaKey&&!e.ctrlKey){chooseTool(t[0])}});
q('.dt-drawing').addEventListener('click',()=>{if(state.tool==='Eyedropper')actions.sampleColor();else if(['Select','Lasso'].includes(state.tool)){state.selected=!state.selected;render()}else toast('Design canvas · use the panels to explore tool options')});
q('.dt-rail').innerHTML=tools.map((t,i)=>`${i===4||i===8||i===10?'<hr>':''}<div class="dt-tool-slot"><button class="dt-icon" data-tool="${t[0]}" aria-label="${t[0]} (${t[2]})" data-tooltip="${t[0]} · tap again for options" aria-pressed="${t[0]===state.tool}">${ico(t[1])}</button><button class="dt-tool-corner" data-action="toolOptions:${t[0]}" aria-label="${t[0]} options" aria-expanded="false">${ico('chevron-down')}</button></div>`).join('');
state.pageUnit='mm';state.pageWidth=210;state.pageHeight=297;state.layers.forEach(l=>l.artName=l.name);

})();
